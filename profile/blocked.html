<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked Players | LootLocker Profile</title>
    <link rel="icon" type="image/x-icon" href="../styles/assets/favicon.ico" />
    <script src="../scripts/init.js"></script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/custom.css" />
  </head>
  <body data-social-type="blocked" data-social-title="Blocked Players">
    <main class="shell">
      <header-placeholder></header-placeholder>

      <section id="pageLayout" class="page-layout">
        <nav-placeholder></nav-placeholder>

        <div id="pageLayoutMain" class="page-layout__main">
          <section
            id="globalError"
            class="notice notice--error hidden"
            role="alert"
          ></section>

          <section class="content" aria-live="polite">
            <article class="card">
              <div class="section-title-row">
                <h3 id="listTitle">Blocked Players</h3>
                <div class="social-head-actions">
                  <span
                    class="social-total-pill"
                    aria-label="Total blocked players"
                  >
                    <span class="social-total-pill__label">Total</span>
                    <strong id="listCount">0</strong>
                  </span>
                </div>
              </div>
              <p
                id="listError"
                class="notice notice--error hidden"
                role="alert"
              ></p>
              <p
                id="socialActionStatus"
                class="notice hidden"
                role="status"
                aria-live="polite"
              ></p>
              <div class="platform-table-wrap">
                <div
                  id="blockedTable"
                  class="platform-table social-table social-table--blocked"
                  aria-label="Blocked players list"
                >
                  <div class="platform-table-header" role="row">
                    <div class="platform-cell platform-cell--header">
                      Player
                    </div>
                    <div
                      class="platform-cell platform-cell--header header-env-key"
                      data-env-key="PUBLIC_UID"
                    >
                      Public UID
                    </div>
                    <div
                      class="platform-cell platform-cell--header platform-cell--action"
                    >
                      Action
                    </div>
                  </div>
                  <div id="socialList" class="platform-table-body">
                    <div class="platform-row">
                      <div class="platform-cell table-empty muted">
                        Loading blocked players...
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>

    <script src="../scripts/custom.js"></script>
    <script type="module" src="../scripts/header.js"></script>
    <script type="module" src="../scripts/pages/social-list.js"></script>
  </body>
</html>
