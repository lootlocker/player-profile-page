<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Followers | LootLocker Profile</title>
    <link rel="icon" type="image/x-icon" href="../styles/assets/favicon.ico" />
    <script>
      (function () {
        var match = document.cookie.match(
          /(?:^|;\s*)ll_theme=(light|dark)(?:;|$)/,
        );
        var saved = match ? match[1] : null;
        var isDark =
          saved === "dark" ||
          (!saved &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/custom.css" />
  </head>
  <body data-social-type="followers" data-social-title="Followers">
    <main class="shell">
      <header-placeholder></header-placeholder>

      <section id="pageLayout" class="page-layout">
        <nav-placeholder></nav-placeholder>

        <div id="pageLayoutMain" class="page-layout__main">
          <section
            id="globalError"
            class="notice notice--error hidden"
            role="alert"
          ></section>

          <section class="content" aria-live="polite">
            <article class="card">
              <div class="section-title-row">
                <h3 id="listTitle">Followers</h3>
                <div class="social-head-actions">
                  <span class="social-total-pill" aria-label="Total followers">
                    <span class="social-total-pill__label">Total</span>
                    <strong id="listCount">0</strong>
                  </span>
                </div>
              </div>
              <p
                id="listError"
                class="notice notice--error hidden"
                role="alert"
              ></p>
              <p
                id="socialActionStatus"
                class="notice hidden"
                role="status"
                aria-live="polite"
              ></p>
              <div class="platform-table-wrap">
                <div
                  id="followersTable"
                  class="platform-table social-table social-table--followers"
                  aria-label="Followers list"
                >
                  <div class="platform-table-header" role="row">
                    <div class="platform-cell platform-cell--header">
                      Player
                    </div>
                    <div
                      class="platform-cell platform-cell--header header-env-key"
                      data-env-key="PUBLIC_UID"
                    >
                      Public UID
                    </div>
                    <div
                      class="platform-cell platform-cell--header platform-cell--action"
                    >
                      Action
                    </div>
                  </div>
                  <div id="socialList" class="platform-table-body">
                    <div class="platform-row">
                      <div class="platform-cell table-empty muted">
                        Loading followers...
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </section>
        </div>
      </section>

      <section
        id="friendActionModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="friendActionModalTitle"
      >
        <div class="modal__card">
          <button
            id="friendActionCloseButton"
            class="modal__close button button--ghost button--small"
            type="button"
            aria-label="Close action modal"
          >
            ×
          </button>
          <h3 id="friendActionModalTitle">Block Player</h3>
          <p id="friendActionMessage" class="muted"></p>
          <p
            id="friendActionStatus"
            class="notice notice--error hidden"
            role="alert"
          ></p>
          <div class="modal__actions">
            <button
              id="friendActionCancelButton"
              class="button button--ghost button--small"
              type="button"
            >
              Cancel
            </button>
            <button
              id="friendActionConfirmButton"
              class="button button--small button--danger"
              type="button"
            >
              Block player
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="../scripts/custom.js"></script>
    <script type="module" src="../scripts/header.js"></script>
    <script type="module" src="../scripts/pages/social-list.js"></script>
  </body>
</html>
