<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscriptions | LootLocker Profile</title>
    <link rel="icon" type="image/x-icon" href="../styles/assets/favicon.ico" />
    <script src="../scripts/init.js"></script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/custom.css" />
    <style>
      #subscriptionsTable .platform-table-header,
      #subscriptionsTable .platform-row {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header-placeholder></header-placeholder>

      <section id="pageLayout" class="page-layout">
        <nav-placeholder></nav-placeholder>

        <div id="pageLayoutMain" class="page-layout__main">
          <section
            id="globalError"
            class="notice notice--error hidden"
            role="alert"
          ></section>

          <section class="content" aria-live="polite">
            <article class="card">
              <div class="section-title-row">
                <h3>Subscriptions</h3>
              </div>
              <p
                id="subscriptionsError"
                class="notice notice--error hidden"
                role="alert"
              ></p>
              <div class="platform-table-wrap">
                <div
                  id="subscriptionsTable"
                  class="platform-table"
                  aria-label="Subscriptions"
                >
                  <div class="platform-table-header" role="row">
                    <div class="platform-cell platform-cell--header">
                      Status
                    </div>
                    <div class="platform-cell platform-cell--header">Store</div>
                    <div class="platform-cell platform-cell--header">
                      Created
                    </div>
                    <div class="platform-cell platform-cell--header">Items</div>
                    <div
                      class="platform-cell platform-cell--header platform-cell--action"
                    >
                      Action
                    </div>
                  </div>
                  <div id="subscriptionsTableBody" class="platform-table-body">
                    <div class="platform-row">
                      <div class="platform-cell table-empty muted">
                        Loading subscriptions...
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="pagination-row">
                <button
                  id="prevPageButton"
                  class="button button--text button--small"
                  type="button"
                  disabled
                >
                  Back
                </button>
                <button
                  id="nextPageButton"
                  class="button button--text button--small"
                  type="button"
                  disabled
                >
                  Next
                </button>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>

    <script src="../scripts/custom.js"></script>
    <script type="module" src="../scripts/header.js"></script>
    <script type="module" src="../scripts/pages/subscriptions.js"></script>
  </body>
</html>
