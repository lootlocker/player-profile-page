<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Keys | LootLocker Profile</title>
    <link rel="icon" type="image/x-icon" href="../styles/assets/favicon.ico" />
    <script>
      (function () {
        var match = document.cookie.match(
          /(?:^|;\s*)ll_theme=(light|dark)(?:;|$)/,
        );
        var saved = match ? match[1] : null;
        var isDark =
          saved === "dark" ||
          (!saved &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/custom.css" />
  </head>
  <body>
    <main class="shell">
      <header-placeholder></header-placeholder>

      <section id="pageLayout" class="page-layout">
        <nav-placeholder></nav-placeholder>

        <div id="pageLayoutMain" class="page-layout__main">
          <section
            id="globalError"
            class="notice notice--error hidden"
            role="alert"
          ></section>

          <section class="content" aria-live="polite">
            <article class="card keys-card">
              <div class="section-title-row">
                <h3>Game Keys</h3>
              </div>
              <p
                id="keysError"
                class="notice notice--error hidden"
                role="alert"
              ></p>
              <div class="platform-table-wrap">
                <div
                  id="keysTable"
                  class="platform-table"
                  aria-label="Platform keys"
                >
                  <div class="platform-table-header" role="row">
                    <div class="platform-cell platform-cell--header">
                      Campaign
                    </div>
                    <div class="platform-cell platform-cell--header">Key</div>
                    <div
                      class="platform-cell platform-cell--header platform-cell--action"
                    >
                      Action
                    </div>
                  </div>
                  <div id="keysTableBody" class="platform-table-body">
                    <div class="platform-row">
                      <div class="platform-cell table-empty muted">
                        Loading game keys...
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>

    <script src="../scripts/custom.js"></script>
    <script type="module" src="../scripts/header.js"></script>
    <script type="module" src="../scripts/pages/keys.js"></script>
  </body>
</html>
