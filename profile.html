<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LootLocker Profile</title>
    <link rel="icon" type="image/x-icon" href="styles/assets/favicon.ico" />
    <script src="scripts/init.js"></script>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/custom.css" />
  </head>
  <body>
    <main class="shell">
      <header-placeholder></header-placeholder>

      <section id="pageLayout" class="page-layout">
        <nav-placeholder></nav-placeholder>

        <div id="pageLayoutMain" class="page-layout__main">
          <section
            id="globalError"
            class="notice notice--error hidden"
            role="alert"
          ></section>

          <section id="appView" class="content" aria-live="polite">
            <article class="card">
              <div class="section-title-row">
                <h3>Settings</h3>
              </div>

              <div class="settings-rows" aria-label="Account details">
                <div class="settings-row">
                  <span class="stat__label">Player Name</span>
                  <div class="player-name-display">
                    <strong id="settingsPlayerName">-</strong>
                    <button
                      id="playerNameEditButton"
                      class="icon-button"
                      type="button"
                      aria-label="Edit player name"
                      title="Edit player name"
                    >
                      <span
                        class="ui-icon ui-icon--pencil"
                        aria-hidden="true"
                      ></span>
                    </button>
                    <div
                      id="playerNameEditRow"
                      class="player-name-inline hidden"
                    >
                      <form id="playerNameForm" class="player-name-form">
                        <input
                          id="playerNameInput"
                          type="text"
                          placeholder="Enter player name"
                          maxlength="128"
                          autocomplete="off"
                        />
                        <div class="player-name-form__actions">
                          <button
                            id="playerNameSaveButton"
                            class="icon-button icon-button--confirm"
                            type="submit"
                            aria-label="Save player name"
                            title="Save player name"
                          >
                            <span
                              class="ui-icon ui-icon--check"
                              aria-hidden="true"
                            ></span>
                          </button>
                          <button
                            id="playerNameCancelButton"
                            class="icon-button icon-button--cancel"
                            type="button"
                            aria-label="Cancel editing player name"
                            title="Cancel editing player name"
                          >
                            <span
                              class="ui-icon ui-icon--x"
                              aria-hidden="true"
                            ></span>
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
                <p
                  id="playerNameStatus"
                  class="notice hidden"
                  role="status"
                  aria-live="polite"
                ></p>
                <div class="settings-row">
                  <span class="stat__label">Public UID</span>
                  <strong id="settingsPublicUid">-</strong>
                </div>
                <div class="settings-row">
                  <span class="stat__label">Joined</span>
                  <strong id="settingsJoinedAt">Unknown</strong>
                </div>
                <div class="settings-row">
                  <span class="stat__label">Last seen</span>
                  <strong id="settingsLastSeenAt">Unknown</strong>
                </div>
                <div class="settings-row">
                  <span class="stat__label">Email</span>
                  <strong id="settingsEmail">Unknown</strong>
                </div>
              </div>
            </article>

            <article class="card">
              <div class="section-title-row">
                <h3>Change Password</h3>
              </div>
              <p class="muted">
                For security, password updates are handled through a reset link
                sent to your account email.
              </p>
              <form id="passwordResetForm" class="settings-form">
                <div class="settings-form__actions">
                  <button id="passwordResetButton" class="button" type="submit">
                    Send reset email
                  </button>
                </div>
              </form>
              <p
                id="passwordResetStatus"
                class="notice hidden"
                role="status"
                aria-live="polite"
              ></p>
            </article>
          </section>
        </div>
      </section>
    </main>

    <script src="scripts/custom.js"></script>
    <script type="module" src="scripts/header.js"></script>
    <script type="module" src="scripts/pages/profile.js"></script>
  </body>
</html>
