<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LootLocker Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="styles/assets/favicon.ico" />
    <script>
      (function () {
        var match = document.cookie.match(
          /(?:^|;\s*)ll_theme=(light|dark)(?:;|$)/,
        );
        var saved = match ? match[1] : null;
        var isDark =
          saved === "dark" ||
          (!saved &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/custom.css" />
  </head>
  <body class="auth-page">
    <main id="authPageShell" class="shell">
      <section
        id="globalError"
        class="notice notice--error hidden"
        role="alert"
      ></section>

      <section id="authLayout" class="auth-layout">
        <header id="authHeader" class="auth-header">
          <div id="authIntroLogoWrap" class="auth-logo" aria-hidden="true">
            <img
              id="authLogo"
              src="styles/assets/custom/logo-lightmode.png"
              alt="LootLocker"
            />
          </div>
        </header>

        <section id="authCard" class="card auth-card">
          <form id="resetForm" class="auth-form" method="post" novalidate>
            <div id="authFormCopy" class="auth-copy">
              <h2 id="authFormTitle">Reset password</h2>
              <p id="authFormDescription" class="muted"></p>
            </div>

            <label id="emailField" class="field">
              <span>Email</span>
              <input
                id="emailInput"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </label>

            <p
              id="authError"
              class="notice notice--error hidden"
              role="alert"
            ></p>

            <p
              id="authSuccess"
              class="notice notice--success hidden"
              role="status"
            ></p>

            <button id="resetSubmit" class="button" type="submit">
              Send reset link
            </button>

            <p class="muted auth-switch">
              <a href="login.html">Back to sign in</a>
            </p>
          </form>
        </section>
      </section>
    </main>

    <script>
      if (window.location.protocol === "file:") {
        const globalError = document.getElementById("globalError");
        globalError.textContent =
          "You are running this page from file://. Use a local web server (for example: python3 -m http.server 8080) so modules, cookies, and API calls work reliably.";
        globalError.classList.remove("hidden");
      }
    </script>
    <script src="scripts/custom.js"></script>
    <script type="module" src="scripts/pages/reset-password.js"></script>
  </body>
</html>
